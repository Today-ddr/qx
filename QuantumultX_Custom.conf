[http_backend]


[mitm]

skip_validating_cert = true
force_sni_domain_name = false

# > 排除不适合 MitM 的敏感域名（TestFlight、丰巢、抖音/头条部分接口、Google主站等）
hostname = -testflight.apple.com, -*.fcbox.com, -*huami.com, -*amemv.com, -*snssdk.com, -www.google.com

# 🟢 说明：passphrase 与 p12 为本地证书部分，若你此前在 QX 已经生成并信任证书，更新配置前请将旧配置最底部的 passphrase 和 p12 代码保留或复制粘贴进来即可免去重新信任证书。
