// ==UserScript==
// @ConfigName        Quantumult X 定制综合终极配置 (去广告 + AIGC/Gemini + 节点位置显示 + DNS深度优化)
// @Author            Based on @ddgksf2013, integrated with @deezertidal, @blackmatrix7, @KOP-XIAO
// @UpdateTime        2026-10-14
// @MainFunction      去开屏广告、应用净化、AIGC/Gemini独立分流、日本/全球多节点测速选择、节点位置实时显示、路由器内网防劫持DNS优化
// ==/UserScript==

[general]

# > 直连网络测试 URL（华为 204 测试，国内极度稳定）
network_check_url = http://connectivitycheck.platform.hicloud.com/generate_204

# > 代理节点延迟测试 URL
server_check_url = http://cp.cloudflare.com/generate_204

# > 服务器测试超时时间 (毫秒)
server_check_timeout = 2500

# > 用于设置图标显示
profile_img_url = https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Rocket.png

# > 首页显示当前节点地理位置、运营商及 IP（deezertidal 脚本）
geo_location_checker = http://ip-api.com/json/?fields=8450015&lang=zh-CN, https://raw.githubusercontent.com/deezertidal/QuantumultX-Rewrite/master/rewrite/ip-api.js

# > 资源解析器（用于远程转换各类规则格式）
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js

# > 绕过代理的本地内网网段（局域网、AirDrop、Bonjour、打印机直连）
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 127.0.0.0/8, 224.0.0.0/24, 239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32

# > 运营商登录、网银安全与跳过代理检测白名单（整合自 Loon skip-proxy 与建行/农行/邮政/招行/平安等银行免密认证）
dns_exclusion_list = *.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com, *.ccb.com, *.ccb.cn, yunbusiness.ccb.com, wxh.wo.cn, gate.lagou.com, *.abchina.com.cn, *.abchina.com, www.shanbay.com, *.psbc.com, *.mobile-bank.psbc.com, *.95559.com.cn, open.e.189.cn, *-update.xoyocdn.com

# > UDP Drop 名单：拦截 443 端口 QUIC/HTTP3，强制回退 TCP，确保去广告与代理平稳流畅
udp_drop_list = 443, STUN, QUIC

# > 自动响应 ICMP Ping 请求（使网络诊断与 Ping 测速不超时）
icmp_auto_reply = true

# > DNS 广告拦截响应模式（NOERROR 无应答模式，彻底解决部分 App 遇到 127.0.0.1 疯狂重试导致的转圈耗电）
dns_reject_domain_behavior = no-error-no-answer


[dns]

# > 禁用 IPv6，规避运营商双栈环境下的高延迟与 DNS 泄露
no-ipv6

# > 禁用系统默认 DNS，防止运营商本地 DNS 劫持
no-system

# > 过滤运营商恶意投毒/拦截的解析结果（遇到虚假 IP 自动等待干净上游响应）
circumvent-ipv4-answer = 127.0.0.1, 0.0.0.0

# > 国内高速公共 DNS
server = 223.5.5.5
server = 119.29.29.29
server = 114.114.114.114

# > 大厂服务国内直连专属解析（加速且防止解析到偏远节点）
server = /*.icloud.com/119.29.29.29
server = /*.icloud.com.cn/119.29.29.29
server = /*.tencent.com/119.29.29.29
server = /*.weixin.com/119.29.29.29
server = /*.alipay.com/223.5.5.5
server = /*.taobao.com/223.5.5.5
server = /*.jd.com/223.5.5.5
server = /*.bilibili.com/119.29.29.29
server = /*.bytedance.com/119.29.29.29

# > 家用/企业路由器与管理后台域名直连（防止开启 QX 无法访问路由器后台）
server = /router.asus.com/system
server = /routerlogin.net/system
server = /orbilogin.com/system
server = /tplogin.cn/system
server = /tplinklogin.net/system
server = /melogin.cn/system
server = /falogin.cn/system
server = /miwifi.com/system
server = /www.miwifi.com/system
server = /router.synology.com/system
server = /amplifi.lan/system
server = /sila.razer.com/system
server = /mediarouter.home/system
server = /myrouter.local/system
server = /www.LinksysSmartWiFi.com/system
server = /LinksysSmartWiFi.com/system
server = /zte.home/system
server = /p.to/system

# > 苹果 App Store 下载 CDN 别名加速
alias = /iosapps.itunes.apple.com/iosapps.itunes.apple.com.download.ks-cdn.com


