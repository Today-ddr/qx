static=🎻 Spotify, 🚀 节点选择, 🇺🇸 美国节点, 🇭🇰 香港节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, direct, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Spotify.png
