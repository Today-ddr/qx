[Mitm]
# 🟢 仅对 B站开屏接口 (app.bilibili.com) 开启轻量解密；强制豁免 B站弹幕 (grpc.biliapi.net / *.biliapi.net / *.chat.bilibili.com) 与国内办公/电商域名
