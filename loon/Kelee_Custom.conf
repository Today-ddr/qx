[Remote Filter]
# 🟢 节点自动筛选（采用可莉深度清洗正则，剔除 0.8× 低质非专线与流量/到期信息；香港组精准锁定 IEPL 专线节点）
All-Nodes = NameRegex, FilterKey = "^(?=.*(.))(?!.*((?i)0\.8×|0\.8x|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel)\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$"
HongKong = NameRegex, FilterKey = "^(?=.*((?i)🇭🇰|港|(\b(HK|Hong)(\d+)?\b)))(?=.*((?i)IEPL))(?!.*((?i)0\.8×|0\.8x|回国|校园|游戏|🎮|(\b(GAME)(\d+)?\b))).*$"
Taiwan = NameRegex, FilterKey = "^(?=.*((?i)🇹🇼|🇨🇳|台|(\b(TW|Tai|Taiwan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)(\d+)?\b))).*$"
Japan = NameRegex, FilterKey = "^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|Japan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)(\d+)?\b))).*$"
Singapore = NameRegex, FilterKey = "^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|Singapore)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)(\d+)?\b))).*$"
USA = NameRegex, FilterKey = "^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|United States)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)(\d+)?\b))).*$"
Korea = NameRegex, FilterKey = "^(?=.*((?i)🇰🇷|韩国|韓|首尔|(\b(KR|Korea)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)(\d+)?\b))).*$"
UK = NameRegex, FilterKey = "^(?=.*((?i)🇬🇧|英国|伦敦|英格兰|England|Britain|(\b(UK)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)(\d+)?\b))).*$"


